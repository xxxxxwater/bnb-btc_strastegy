name: GitHub Release and GHCR
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag matches version
        id: meta
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          TAG="$(printf '%s\n' "$HEAD_MESSAGE" | head -n1 | sed -nE 's/^release: (v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p')"
          test -n "$TAG" || { echo 'Invalid version'; exit 1; }
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$TAG" = "v$VERSION" || { echo 'Version mismatch'; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package, syntax and tests
        run: |
          python -m pip install -e '.[test]'
          python -m pip check
          python -m compileall -q bnb_btc_strategy OptimizedCTA_v2_Strategy.py OptimizedETHStrategy.py
          python -m pytest
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
      - name: Create tag and GitHub Release after successful image push
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file RELEASE_NOTES.md
